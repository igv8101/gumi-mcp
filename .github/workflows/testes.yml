name: testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  suite:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Rodar a suíte
        run: pytest -q

      - name: Verificação adversarial contra a própria pasta
        # Sem GUMI_MCP_ROOT o servidor serve só a si mesmo — o bastante para
        # provar que a política barra os caminhos que precisa barrar.
        run: python tests/verificacao_adversarial.py
